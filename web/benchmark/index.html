<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goose 3D draw-call benchmark</title>
<style>
  :root { color-scheme: dark; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10151d; color: #e0e7f1; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #panel { position: fixed; top: 16px; left: 16px; width: min(420px, calc(100vw - 64px));
    padding: 14px 16px; background: #111923eF; border: 1px solid #3a4656; border-radius: 8px; }
  h1 { margin: 0 0 10px; font-size: 15px; }
  label { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  input { grid-column: 1 / -1; width: 100%; accent-color: #64c8ff; }
  #count { color: #83d5ff; }
  #results { margin-top: 12px; white-space: pre-line; }
  #note { margin-top: 10px; color: #95a2b4; font: 12px/1.5 system-ui, sans-serif; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; color: #e0e7f1; }
  #status:empty { display: none; }
</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <section id="panel">
    <h1>WebGL2 instancing benchmark</h1>
    <p><a href="./compare.html">Compare Goose 3D with Three.js</a></p>
    <label for="nodes"><span>Visible repeated cubes</span><output id="count">1024</output></label>
    <input id="nodes" type="range" min="1" max="1024" step="1" value="1024">
    <div id="results">warming up…</div>
    <div id="note">CPU frame time measures the synchronous engine call. Browser frame rate is limited by display refresh. GPU calls count scene draws; shadow and presentation passes are excluded.</div>
  </section>
  <div id="status">Starting WebGL2…</div>
  <script type="module" src="./benchmark.js"></script>
</body>
</html>
